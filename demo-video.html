<!DOCTYPE html>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    @keyframes pulse-slow {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.02); }
    }
    .cursor-pointer-sim {
      position: absolute;
      width: 26px;
      height: 26px;
      pointer-events: none;
      z-index: 9999;
      transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
    }
    .cursor-click-ring {
      position: absolute;
      width: 40px;
      height: 40px;
      border: 3px solid #14b8a6;
      border-radius: 50%;
      top: -7px;
      left: -7px;
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.4s ease-out;
      pointer-events: none;
    }
    .cursor-click-ring.active {
      opacity: 1;
      transform: scale(1.4);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

        <!-- SCENE CONTAINER -->

        </div>

                  <input type="password" value="••••••••••••" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs" readonly />
                </div>
                <button id="patientSignInBtn" class="w-full py-3 bg-teal-600 text-white font-bold text-xs rounded-xl shadow-lg shadow-teal-500/20">
                  Sign In as Patient &rarr;
                </button>
                <div class="text-center text-[10px] text-slate-400">
                  Protected with 256-bit SSL Medical Encryption
                </div>
              </div>
            </div>
          </div>
        `,
        actions: [
          { time: 2000, x: '50%', y: '65%' },
          { time: 4000, x: '50%', y: '65%', click: true, toast: 'Authenticating Patient Rahul Verma...' },
          { time: 7000, x: '50%', y: '65%', toast: 'Signed in! Redirecting to Patient Portal...' },
        ]
      },

      {
        id: 'book-appointment',
        title: 'Scene 5: Selecting Specialist & Booking Appointment',
        duration: 18000,
        render: () => `
          <div class="h-full flex flex-col bg-slate-950 text-white overflow-hidden">
            <!-- Header -->
            <div class="h-12 border-b border-slate-800 px-6 flex items-center justify-between bg-slate-900">
              <span class="text-xs font-bold text-teal-400">Book Doctor Appointment &bull; Specialist Directory</span>
              <span class="text-xs text-slate-400">Patient: Rahul Verma</span>
            </div>

            <!-- Booking UI -->
            <div class="flex-1 p-6 grid grid-cols-12 gap-4 overflow-hidden">
              
              <!-- Doctor Card -->
              <div class="col-span-5 bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3">
                <div class="flex items-center gap-3">
                  <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-indigo-500 to-blue-600 flex items-center justify-center font-bold text-white text-base">AS</div>
                  <div>
                    <h4 class="font-extrabold text-white text-sm">Dr. Anika Sharma</h4>
                    <p class="text-xs text-teal-400 font-bold">Cardiologist (DOC-1001)</p>
                    <p class="text-[10px] text-slate-400">12 yrs exp &bull; AIIMS Delhi &bull; 4.8 ⭐</p>
                  </div>
                </div>
                <div class="pt-2 border-t border-slate-800 flex justify-between text-xs">
                  <span class="text-slate-400">Consultation Fee:</span>
                  <span class="font-extrabold text-teal-300">₹800</span>
                </div>
              </div>

              <!-- Slot Picker & Form -->
              <div class="col-span-7 bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3">
                <h4 class="text-xs font-bold text-slate-300">Choose Available Time Slot:</h4>
                <div class="grid grid-cols-3 gap-2">
                  <button class="py-2 px-2 text-xs rounded-xl bg-slate-800 text-slate-400 border border-slate-700">09:30 AM</button>
                  <button id="slotBtn10" class="py-2 px-2 text-xs rounded-xl bg-teal-500 text-slate-950 font-bold border border-teal-400 shadow">10:30 AM (Selected)</button>
                  <button class="py-2 px-2 text-xs rounded-xl bg-slate-800 text-slate-400 border border-slate-700">11:30 AM</button>
                </div>

                <div>
                  <label class="block text-xs font-bold text-slate-400 mb-1">Reason for Visit</label>
                  <input type="text" value="Routine cardiology follow-up &amp; ECG review" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-xs text-slate-200" readonly />
                </div>

                <button id="confirmBookingBtn" class="w-full py-2.5 bg-gradient-to-r from-teal-400 to-emerald-400 text-slate-950 font-bold text-xs rounded-xl shadow-lg transition">
                  Confirm &amp; Book Appointment
                </button>

                <!-- Confirmed Token Pill -->
                <div id="bookingSuccessPill" class="hidden p-3 rounded-xl bg-emerald-950/80 border border-emerald-600 text-emerald-300 text-xs text-center font-bold">
                  🎉 Appointment Confirmed! Assigned Token #08 &bull; Dr. Anika Sharma
                </div>
              </div>

            </div>
          </div>
        `,
        actions: [
          { time: 2000, x: '68%', y: '30%' },
          { time: 3500, x: '68%', y: '30%', click: true, toast: 'Selected time slot: 10:30 AM' },
          { time: 6000, x: '75%', y: '75%' },
          { time: 7500, x: '75%', y: '75%', click: true, toast: 'Booking confirmed! Token #08 generated.', custom: () => {
              const pill = document.getElementById('bookingSuccessPill');
              if (pill) pill.classList.remove('hidden');
            }},
          { time: 12000, x: '50%', y: '50%' }
        ]
      }
    ];

    // ── PLAYER ENGINE ──
    let currentSceneIdx = 0;
    let sceneStartTime = 0;
    let isPlaying = true;
    let playbackSpeed = 1;
    let animFrameId = null;

    const totalDuration = SCENES.reduce((acc, s) => acc + s.duration, 0);

    const sceneContainer = document.getElementById('sceneContainer');
    const simCursor = document.getElementById('simCursor');
    const clickRing = document.getElementById('clickRing');
    const sceneTitle = document.getElementById('sceneTitle');
    const progressBar = document.getElementById('progressBar');
    const currentTimeEl = document.getElementById('currentTime');
    const totalTimeEl = document.getElementById('totalTime');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const restartBtn = document.getElementById('restartBtn');
    const toastContainer = document.getElementById('toastContainer');

    function formatTime(ms) {
      const totalSec = Math.floor(ms / 1000);
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    totalTimeEl.textContent = formatTime(totalDuration);

    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = 'px-4 py-2.5 rounded-xl bg-slate-900 border border-teal-500/50 text-white text-xs font-semibold shadow-2xl flex items-center gap-2 transform translate-y-2 opacity-0 transition-all duration-300';
      toast.innerHTML = `<span class="w-2 h-2 rounded-full bg-teal-400"></span> ${message}`;
      toastContainer.appendChild(toast);
      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      });
      setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-2');
        setTimeout(() => toast.remove(), 400);
      }, 3500);
    }

    function triggerClickRing() {
      clickRing.classList.add('active');
      setTimeout(() => clickRing.classList.remove('active'), 350);
    }

    function loadScene(idx) {
      currentSceneIdx = idx;
      const scene = SCENES[currentSceneIdx];
      sceneContainer.innerHTML = scene.render();
      sceneTitle.textContent = scene.title;
      sceneStartTime = performance.now();
      simCursor.style.top = '70%';
      simCursor.style.left = '50%';
    }

    function getElapsedTimeBeforeScene(idx) {
      let time = 0;
      for (let i = 0; i < idx; i++) time += SCENES[i].duration;
      return time;
    }

    function updateFrame(now) {
      if (!isPlaying) return;

      const scene = SCENES[currentSceneIdx];
      const sceneElapsed = (now - sceneStartTime) * playbackSpeed;

      // Handle scene actions
      if (scene.actions) {
        for (const action of scene.actions) {
          if (!action._done && sceneElapsed >= action.time) {
            action._done = true;
            if (action.x && action.y) {
              simCursor.style.left = action.x;
              simCursor.style.top = action.y;
            }
            if (action.click) triggerClickRing();
            if (action.toast) showToast(action.toast);
            if (action.custom) action.custom();
          }
        }
      }

      // Check scene complete
      if (sceneElapsed >= scene.duration) {
        if (currentSceneIdx < SCENES.length - 1) {
          loadScene(currentSceneIdx + 1);
        } else {
          // Finished entire video -> loop
          showToast('Walkthrough complete! Looping demo video...');
          SCENES.forEach(s => s.actions && s.actions.forEach(a => a._done = false));
          loadScene(0);
        }
      }

      // Progress bar & Time update
      const totalElapsed = getElapsedTimeBeforeScene(currentSceneIdx) + sceneElapsed;
      const progressPct = Math.min((totalElapsed / totalDuration) * 100, 100);
      progressBar.style.width = `${progressPct}%`;
      currentTimeEl.textContent = formatTime(totalElapsed);

      animFrameId = requestAnimationFrame(updateFrame);
    }

    function play() {
      isPlaying = true;
      sceneStartTime = performance.now();
      playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      animFrameId = requestAnimationFrame(updateFrame);
    }

    function pause() {
      isPlaying = false;
      playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      cancelAnimationFrame(animFrameId);
    }

    playBtn.addEventListener('click', () => {
      if (isPlaying) pause(); else play();
    });

    restartBtn.addEventListener('click', () => {
      SCENES.forEach(s => s.actions && s.actions.forEach(a => a._done = false));
      loadScene(0);
      play();
    });

    // Jump Buttons
    document.querySelectorAll('.jump-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const sceneNum = parseInt(btn.dataset.scene, 10);
        SCENES.forEach(s => s.actions && s.actions.forEach(a => a._done = false));
        loadScene(sceneNum);
        if (!isPlaying) play();
      });
    });

    // Speed Controls
    document.querySelectorAll('.speed-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.speed-btn').forEach(b => {
          b.classList.remove('text-teal-400', 'font-bold');
          b.classList.add('text-slate-400');
        });
        btn.classList.add('text-teal-400', 'font-bold');
        playbackSpeed = parseFloat(btn.dataset.speed);
      });
    });

    // Seek Timeline
    document.getElementById('progressBarContainer').addEventListener('click', (e) => {
      const rect = e.currentTarget.getBoundingClientRect();
      const clickPct = (e.clientX - rect.left) / rect.width;
      const targetTime = clickPct * totalDuration;

      let accumulated = 0;
      for (let i = 0; i < SCENES.length; i++) {
        if (targetTime <= accumulated + SCENES[i].duration) {
          SCENES.forEach(s => s.actions && s.actions.forEach(a => a._done = false));
          loadScene(i);
          sceneStartTime = performance.now() - ((targetTime - accumulated) / playbackSpeed);
          break;
        }
        accumulated += SCENES[i].duration;
      }
    });

    // ── VIDEO RECORDING & DOWNLOAD (.webm) ──
    const downloadBtn = document.getElementById('downloadVideoBtn');
    let mediaRecorder = null;
    let recordedChunks = [];

    downloadBtn.addEventListener('click', async () => {
      try {
        downloadBtn.innerHTML = '🔴 Recording in Progress... Click again to Save';
        downloadBtn.classList.remove('from-teal-500', 'to-emerald-500');
        downloadBtn.classList.add('bg-rose-600', 'text-white');

        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: { frameRate: 30 }
        });

        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9' });
        recordedChunks = [];

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'medicare-doctor-management-demo.webm';
          a.click();
          URL.revokeObjectURL(url);
          downloadBtn.innerHTML = '✅ Video Downloaded! Record Again';
        };

        mediaRecorder.start();
        showToast('Screen capture active! Record your walkthrough and click Stop.');
      } catch (err) {
        showToast('Tip: You can use your browser or OBS to record this animated canvas anytime!');
        downloadBtn.innerHTML = 'Record & Download Video (.webm)';
      }
    });

    // Initial Load & Start
    loadScene(0);
    play();
  </script>
</body>
</html>
